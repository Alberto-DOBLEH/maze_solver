<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { background: #ffffff; font-family: "DejaVu Sans", "Segoe UI", sans-serif; }
  .lienzo { background: #fff; padding: 24px; display: inline-block; }
  svg { display: block; }
  text { font-family: "DejaVu Sans", "Segoe UI", sans-serif; fill: #1e293b; }
  .t { font-size: 17px; font-weight: 600; }
  .ts { font-size: 14px; font-weight: 500; }
  .txs { font-size: 12.5px; fill: #475569; }
  .cond { font-size: 15px; font-weight: 600; }
  .eti { font-size: 13px; font-weight: 700; fill: #475569; }
</style>
</head>
<body>

<!-- ================= DIAGRAMA 1: FLUJO DEL PROGRAMA ================= -->
<div class="lienzo" id="flujo">
<svg width="1000" height="1310" viewBox="0 0 1000 1310">
  <defs>
    <marker id="fl" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect x="330" y="24" width="200" height="52" rx="26" fill="#0f766e"/>
  <text x="430" y="57" text-anchor="middle" class="t" fill="#ffffff">Inicio</text>

  <rect x="210" y="110" width="440" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="430" y="135" text-anchor="middle" class="ts">Abrir la aplicación en el navegador</text>
  <text x="430" y="154" text-anchor="middle" class="txs">http://127.0.0.1:5000</text>

  <rect x="210" y="200" width="440" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="430" y="225" text-anchor="middle" class="ts">Generar laberinto, cargar .txt o dibujar muros</text>
  <text x="430" y="244" text-anchor="middle" class="txs">el laberinto puede editarse en cualquier momento</text>

  <rect x="255" y="290" width="350" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="430" y="315" text-anchor="middle" class="ts">Seleccionar el algoritmo</text>
  <text x="430" y="334" text-anchor="middle" class="txs">BFS (cola) o DFS (pila)</text>

  <rect x="225" y="380" width="410" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="430" y="405" text-anchor="middle" class="ts">POST /api/solve</text>
  <text x="430" y="424" text-anchor="middle" class="txs">se envía el laberinto y el algoritmo en JSON</text>

  <polygon points="430,470 620,548 430,626 240,548" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="430" y="542" text-anchor="middle" class="cond">¿Laberinto y</text>
  <text x="430" y="562" text-anchor="middle" class="cond">algoritmo válidos?</text>

  <rect x="700" y="518" width="270" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="835" y="543" text-anchor="middle" class="ts">Devolver error 400</text>
  <text x="835" y="562" text-anchor="middle" class="txs">mensaje explicativo al usuario</text>

  <rect x="215" y="666" width="430" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="430" y="691" text-anchor="middle" class="ts">Inicializar la frontera con el inicio</text>
  <text x="430" y="710" text-anchor="middle" class="txs">deque FIFO para BFS · lista LIFO para DFS</text>

  <polygon points="430,762 600,820 430,878 260,820" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="430" y="814" text-anchor="middle" class="cond">¿Quedan nodos</text>
  <text x="430" y="834" text-anchor="middle" class="cond">en la frontera?</text>

  <rect x="700" y="790" width="270" height="60" rx="10" fill="#fee2e2" stroke="#dc2626" stroke-width="1.6"/>
  <text x="835" y="815" text-anchor="middle" class="ts">No existe ruta</text>
  <text x="835" y="834" text-anchor="middle" class="txs">se informa al usuario y termina</text>

  <rect x="280" y="916" width="300" height="54" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="430" y="949" text-anchor="middle" class="ts">Extraer un nodo de la frontera</text>

  <polygon points="430,1010 600,1068 430,1126 260,1068" fill="#fef3c7" stroke="#d97706" stroke-width="1.6"/>
  <text x="430" y="1062" text-anchor="middle" class="cond">¿El nodo es</text>
  <text x="430" y="1082" text-anchor="middle" class="cond">la meta?</text>

  <rect x="170" y="1166" width="520" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="430" y="1191" text-anchor="middle" class="ts">Registrar la visita y agregar los vecinos no visitados</text>
  <text x="430" y="1210" text-anchor="middle" class="txs">cada vecino guarda su predecesor (came_from)</text>

  <rect x="790" y="1040" width="190" height="56" rx="10" fill="#dcfce7" stroke="#16a34a" stroke-width="1.6"/>
  <text x="885" y="1065" text-anchor="middle" class="ts">Reconstruir</text>
  <text x="885" y="1084" text-anchor="middle" class="ts">el camino</text>

  <rect x="780" y="1130" width="210" height="56" rx="10" fill="#eff6ff" stroke="#2563eb" stroke-width="1.6"/>
  <text x="885" y="1155" text-anchor="middle" class="ts">Animar y mostrar</text>
  <text x="885" y="1174" text-anchor="middle" class="txs">camino, exploración y métricas</text>

  <rect x="790" y="1226" width="190" height="52" rx="26" fill="#0f766e"/>
  <text x="885" y="1259" text-anchor="middle" class="t" fill="#ffffff">Fin</text>

  <!-- flujo principal -->
  <g stroke="#64748b" stroke-width="1.7" fill="none" marker-end="url(#fl)">
    <path d="M430 76 L430 108"/>
    <path d="M430 166 L430 198"/>
    <path d="M430 256 L430 288"/>
    <path d="M430 346 L430 378"/>
    <path d="M430 436 L430 468"/>
    <path d="M430 626 L430 664"/>
    <path d="M430 722 L430 760"/>
    <path d="M430 878 L430 914"/>
    <path d="M430 970 L430 1008"/>
    <path d="M430 1126 L430 1164"/>
  </g>

  <!-- decisión 1: no -->
  <path d="M620 548 L698 548" stroke="#64748b" stroke-width="1.7" fill="none" marker-end="url(#fl)"/>
  <text x="656" y="539" text-anchor="middle" class="eti">No</text>
  <path d="M835 578 L835 602 L700 602 L700 228 L654 228" stroke="#64748b" stroke-width="1.5"
        fill="none" stroke-dasharray="6 5" marker-end="url(#fl)"/>
  <text x="712" y="222" class="eti">corregir</text>
  <text x="446" y="652" class="eti">Sí</text>

  <!-- frontera vacía -->
  <path d="M600 820 L698 820" stroke="#64748b" stroke-width="1.7" fill="none" marker-end="url(#fl)"/>
  <text x="650" y="810" text-anchor="middle" class="eti">Sí</text>
  <text x="446" y="900" class="eti">No</text>

  <!-- decisión 2 -->
  <path d="M600 1068 L788 1068" stroke="#64748b" stroke-width="1.7" fill="none" marker-end="url(#fl)"/>
  <text x="690" y="1058" text-anchor="middle" class="eti">Sí</text>
  <path d="M885 1096 L885 1128" stroke="#64748b" stroke-width="1.7" fill="none" marker-end="url(#fl)"/>
  <path d="M885 1186 L885 1224" stroke="#64748b" stroke-width="1.7" fill="none" marker-end="url(#fl)"/>
  <text x="446" y="1148" class="eti">No</text>

  <!-- ciclo de exploración -->
  <path d="M170 1194 L140 1194 L140 820 L258 820" stroke="#64748b" stroke-width="1.6"
        fill="none" marker-end="url(#fl)"/>
  <text x="150" y="1000" class="eti" transform="rotate(-90 150 1000)">repetir</text>
</svg>
</div>

<!-- ================= DIAGRAMA 2: ARQUITECTURA ================= -->
<div class="lienzo" id="arquitectura">
<svg width="1000" height="620" viewBox="0 0 1000 620">
  <defs>
    <marker id="a2" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M 0 0 L 10 5 L 0 10 z" fill="#64748b"/>
    </marker>
  </defs>

  <!-- cliente -->
  <rect x="30" y="40" width="330" height="240" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="50" y="70" class="t">Navegador (cliente)</text>
  <rect x="55" y="88" width="280" height="42" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="195" y="114" text-anchor="middle" class="ts">index.html · estructura</text>
  <rect x="55" y="140" width="280" height="42" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="195" y="166" text-anchor="middle" class="ts">styles.css · presentación</text>
  <rect x="55" y="192" width="280" height="66" rx="8" fill="#eff6ff" stroke="#2563eb" stroke-width="1.4"/>
  <text x="195" y="218" text-anchor="middle" class="ts">app.js</text>
  <text x="195" y="240" text-anchor="middle" class="txs">canvas, animación, edición</text>

  <!-- servidor -->
  <rect x="470" y="40" width="500" height="240" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="490" y="70" class="t">Servidor Flask (app.py)</text>
  <rect x="495" y="88" width="450" height="42" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="720" y="114" text-anchor="middle" class="ts">GET /  ·  GET /api/salud</text>
  <rect x="495" y="140" width="450" height="42" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="720" y="166" text-anchor="middle" class="ts">POST /api/generate  ·  POST /api/parse</text>
  <rect x="495" y="192" width="450" height="42" rx="8" fill="#ecfdf5" stroke="#0f766e" stroke-width="1.4"/>
  <text x="720" y="218" text-anchor="middle" class="ts">POST /api/solve  ·  POST /api/compare</text>
  <text x="720" y="262" text-anchor="middle" class="txs">valida la entrada y responde JSON</text>

  <!-- paquete maze -->
  <rect x="470" y="365" width="340" height="205" rx="14" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.6"/>
  <text x="490" y="395" class="t">Paquete maze (lógica pura)</text>
  <rect x="495" y="410" width="290" height="42" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="640" y="436" text-anchor="middle" class="ts">grid.py · modelo Maze</text>
  <rect x="495" y="462" width="290" height="42" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="640" y="488" text-anchor="middle" class="ts">generator.py · backtracking</text>
  <rect x="495" y="514" width="290" height="42" rx="8" fill="#fef3c7" stroke="#d97706" stroke-width="1.4"/>
  <text x="640" y="540" text-anchor="middle" class="ts">solver.py · BFS y DFS</text>

  <!-- pruebas -->
  <rect x="850" y="430" width="120" height="100" rx="12" fill="#f5f3ff" stroke="#7c3aed" stroke-width="1.5"/>
  <text x="910" y="470" text-anchor="middle" class="ts">pytest</text>
  <text x="910" y="492" text-anchor="middle" class="txs">54 pruebas</text>

  <!-- archivos -->
  <rect x="60" y="430" width="320" height="100" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="220" y="468" text-anchor="middle" class="ts">Archivos .txt</text>
  <text x="220" y="490" text-anchor="middle" class="txs">cargar y guardar laberintos</text>
  <text x="220" y="510" text-anchor="middle" class="txs"># muro · . pasillo · S inicio · G meta</text>

  <!-- flechas -->
  <path d="M362 160 L468 160" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a2)" marker-start="url(#a2)"/>
  <text x="415" y="146" text-anchor="middle" class="eti">JSON</text>
  <text x="415" y="184" text-anchor="middle" class="txs">HTTP</text>

  <path d="M720 282 L720 363" stroke="#64748b" stroke-width="2" fill="none" marker-end="url(#a2)" marker-start="url(#a2)"/>
  <text x="732" y="328" class="txs">importa</text>

  <path d="M812 480 L848 480" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#a2)"/>

  <path d="M220 428 L220 286" stroke="#64748b" stroke-width="1.8" fill="none" marker-end="url(#a2)" stroke-dasharray="6 4"/>
  <text x="232" y="360" class="txs">se leen y guardan desde el cliente</text>
</svg>
</div>

</body>
</html>
